spring.config.import=optional:file:.env[.properties],optional:file:Back_end/.env[.properties]

spring.application.name=web-bansach

server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Kết nối Redis; các giá trị thực tế được lấy từ file .env
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
# Dự án chỉ dùng Redis làm cache, không dùng Redis Repository
spring.data.redis.repositories.enabled=false
# Chỉ sử dụng Redis làm bộ nhớ đệm, không tự tạo bộ nhớ đệm đơn giản trong JVM
spring.cache.type=redis

# RabbitMQ is used for background email delivery.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Cấu hình máy chủ Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Đọc tài khoản và mật khẩu ứng dụng Gmail từ các biến trong file .env
spring.mail.username=${GMAIL_USERNAME:noreply@webbansach.local}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:your-secret-key-change-this-in-production}}
app.jwt.expiration=${APP_JWT_EXPIRATION:${JWT_EXPIRATION:1800000}}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# SePay Configuration
sepay.bank-code=${SEPAY_BANK_CODE:MB}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-name=${SEPAY_ACCOUNT_NAME:SEPAY JSC}
sepay.payment-template=${SEPAY_PAYMENT_TEMPLATE:compact}
sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.return-url=${SEPAY_RETURN_URL:${app.frontend-url}/payment-result}

# Application URL for callbacks and realtime links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.frontend-url}}

logging.level.root=INFO
logging.level.com.example.web_bansach=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} requestId=%X{requestId} [%thread] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
