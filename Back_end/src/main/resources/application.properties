spring.datasource.url=jdbc:mysql://localhost:3306/DUAN_WEBBANSACH?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:your-secret-key-change-this-in-production}
app.jwt.expiration=${APP_JWT_EXPIRATION:1800000}
app.jwt.refresh-token-secret=${APP_JWT_REFRESH_TOKEN_SECRET:your-refresh-token-secret-change-this-in-production}
app.jwt.refresh-token-expiration=${APP_JWT_REFRESH_TOKEN_EXPIRATION:2592000000}
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:1800000}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# SePay Configuration
sepay.bank-code=${SEPAY_BANK_CODE:MB}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-name=${SEPAY_ACCOUNT_NAME:SEPAY JSC}
sepay.payment-template=${SEPAY_PAYMENT_TEMPLATE:compact}
sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.return-url=${SEPAY_RETURN_URL:http://localhost:3000/payment-result}
sepay.api-key=${SEPAY_API_KEY:}
sepay.status-api-url=${SEPAY_STATUS_API_URL:}
sepay.refund-api-url=${SEPAY_REFUND_API_URL:}
sepay.request-timeout-ms=${SEPAY_REQUEST_TIMEOUT_MS:5000}

# Application URL for callbacks
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}


