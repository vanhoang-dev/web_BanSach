spring.config.import=optional:file:.env[.properties],optional:file:Back_end/.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:your-secret-key-change-this-in-production}}
app.jwt.expiration=${APP_JWT_EXPIRATION:${JWT_EXPIRATION:1800000}}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# SePay Configuration
sepay.bank-code=${SEPAY_BANK_CODE:MB}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-name=${SEPAY_ACCOUNT_NAME:SEPAY JSC}
sepay.payment-template=${SEPAY_PAYMENT_TEMPLATE:compact}
sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.return-url=${SEPAY_RETURN_URL:${app.frontend-url}/payment-result}

# Application URL for callbacks and realtime links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.frontend-url},http://localhost:3000,http://localhost:5173}
