services:
  mysql:
    image: mysql:8.0
    container_name: web_bansach_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-web_bansach}
      MYSQL_USER: ${MYSQL_USER:-spring}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spring}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-bansach-backend:latest
    container_name: web_bansach_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-web_bansach}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-spring}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-spring}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}

      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-secret-before-deploy}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-1800000}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://localhost:8080}

      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-MB}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-SEPAY JSC}
      SEPAY_PAYMENT_TEMPLATE: ${SEPAY_PAYMENT_TEMPLATE:-compact}
      SEPAY_QR_BASE_URL: ${SEPAY_QR_BASE_URL:-https://qr.sepay.vn/img}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_STATUS_API_URL: ${SEPAY_STATUS_API_URL:-}
      SEPAY_REFUND_API_URL: ${SEPAY_REFUND_API_URL:-}
      SEPAY_REQUEST_TIMEOUT_MS: ${SEPAY_REQUEST_TIMEOUT_MS:-5000}
    ports:
      - "${BACKEND_PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped

volumes:
  mysql_data:
