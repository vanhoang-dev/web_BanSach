name: Build and deploy to k3s # Tên workflow hiển thị trên GitHub Actions

on: # Cấu hình các sự kiện kích hoạt workflow
  push: # Tự động chạy khi có code được push
    branches: [main] # Chỉ chạy khi push lên nhánh main
  workflow_dispatch: # Cho phép chạy thủ công từ giao diện GitHub Actions

env: # Biến môi trường dùng chung cho các job
  DOCKERHUB_NAMESPACE: hoangdev311
  BACKEND_IMAGE: hoangdev311/web-bansach-backend
  FRONTEND_IMAGE: hoangdev311/web-bansach-frontend
  VITE_API_BASE_URL: https://api.hoanghh.xyz
  AWS_REGION: ap-southeast-1
  K3S_SECURITY_GROUP_ID: sg-031c85ae4faf16f5c

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front_end/package-lock.json

      # ==============================
      # TEST BACKEND
      # ==============================
      - name: Test backend
        working-directory: Back_end
        run: mvn test

      # ==============================
      # TEST + BUILD FRONTEND
      # ==============================
      - name: Test and build frontend
        working-directory: front_end
        run: |
          npm ci
          npm test
          VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} npm run build

      # ==============================
      # LOGIN DOCKER HUB
      # ==============================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================
      # BUILD + PUSH BACKEND
      # ==============================
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Back_end
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      # ==============================
      # BUILD + PUSH FRONTEND
      # ==============================
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front_end
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ==========================================================
  # DEPLOY TO K3S
  # ==========================================================
  deploy:
    runs-on: ubuntu-latest
    needs: test-build-push

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==============================
      # AWS LOGIN
      # ==============================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ==============================
      # OPEN K3S API FOR GITHUB RUNNER
      # ==============================
      - name: Allow GitHub runner to access k3s API
        run: |
          RUNNER_IP="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')"

          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

          aws ec2 authorize-security-group-ingress \
            --group-id "${{ env.K3S_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 6443 \
            --cidr "$RUNNER_IP/32" \
            --tag-specifications 'ResourceType=security-group-rule,Tags=[{Key=Name,Value=github-actions-k3s-api}]' \
          || echo "Ingress rule may already exist"

      # ==============================
      # INSTALL KUBECTL
      # ==============================
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # ==============================
      # CONFIGURE KUBECONFIG
      # ==============================
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # ==============================
      # TEST K3S CONNECTION
      # ==============================
      - name: Test k3s connection
        run: |
          kubectl get nodes

      # ==============================
      # APPLY KUBERNETES MANIFESTS
      # ==============================
      - name: Apply manifests
        run: |
          kubectl apply -f infrastructure/kubernetes/00-namespace.yaml

          kubectl apply -f infrastructure/kubernetes/01-configmap.yaml

          kubectl -n web-bansach create secret generic web-bansach-secret \
            --from-literal=MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            --from-literal=REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}' \
            --from-literal=RABBITMQ_PASSWORD='${{ secrets.RABBITMQ_PASSWORD }}' \
            --from-literal=APP_JWT_SECRET='${{ secrets.APP_JWT_SECRET }}' \
            --from-literal=GMAIL_USERNAME='${{ secrets.GMAIL_USERNAME }}' \
            --from-literal=GMAIL_APP_PASSWORD='${{ secrets.GMAIL_APP_PASSWORD }}' \
            --from-literal=CLOUDINARY_CLOUD_NAME='${{ secrets.CLOUDINARY_CLOUD_NAME }}' \
            --from-literal=CLOUDINARY_API_KEY='${{ secrets.CLOUDINARY_API_KEY }}' \
            --from-literal=CLOUDINARY_API_SECRET='${{ secrets.CLOUDINARY_API_SECRET }}' \
            --from-literal=SEPAY_ACCOUNT_NUMBER='${{ secrets.SEPAY_ACCOUNT_NUMBER }}' \
            --from-literal=SEPAY_ACCOUNT_NAME='${{ secrets.SEPAY_ACCOUNT_NAME }}' \
            --from-literal=SEPAY_WEBHOOK_API_KEY='${{ secrets.SEPAY_WEBHOOK_API_KEY }}' \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl apply -f infrastructure/kubernetes/03-storage.yaml

          kubectl apply -f infrastructure/kubernetes/04-datastores.yaml

          kubectl apply -f infrastructure/kubernetes/08-monitoring.yaml

          kubectl apply -f infrastructure/kubernetes/09-cert-manager-issuer.yaml

          kubectl apply -f infrastructure/kubernetes/05-backend.yaml

          kubectl apply -f infrastructure/kubernetes/06-frontend.yaml

          kubectl apply -f infrastructure/kubernetes/07-ingress.yaml

      # ==============================
      # DEPLOY EXACT COMMIT IMAGES
      # ==============================
      - name: Rollout images
        run: |
          kubectl -n web-bansach set image \
            deployment/backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          kubectl -n web-bansach set image \
            deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          kubectl -n web-bansach rollout status \
            deployment/backend \
            --timeout=180s

          kubectl -n web-bansach rollout status \
            deployment/frontend \
            --timeout=180s

      # ==============================
      # SHOW DEPLOYMENT STATUS
      # ==============================
      - name: Show deployment status
        run: |
          kubectl get nodes
          kubectl get pods -n web-bansach
          kubectl get svc -n web-bansach
          kubectl get ingress -n web-bansach

      # ==============================
      # REMOVE TEMPORARY PORT 6443 RULE
      # ==============================
      - name: Revoke GitHub runner k3s API access
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ env.K3S_SECURITY_GROUP_ID }}" \
              --protocol tcp \
              --port 6443 \
              --cidr "$RUNNER_IP/32" \
            || echo "Ingress rule was already removed"
          fi