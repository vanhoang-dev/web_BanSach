name: Deploy project

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Skip deploy when secrets are not configured
        if: ${{ secrets.VPS_HOST == '' || secrets.VPS_USER == '' || secrets.VPS_KEY == '' }}
        run: echo "VPS deploy secrets are not configured. Skipping deploy step."

      - name : Deloy project vps
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_KEY != '' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /root/docker_githubaction
            git pull
            docker-compose down
            docker-compose build
            docker-compose up -d
            docker images -f "dangling=true" -q | xargs -r docker rmi