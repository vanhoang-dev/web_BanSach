services:
  mysql_db:
    image: mysql:8.0
    container_name: web-bansach-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DUAN_WEBBANSACH}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_db:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:7.4-alpine
    container_name: web-bansach-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: web-bansach-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-web_bansach}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-web_bansach_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  backend:
    build: ./Back_end
    container_name: web-bansach-backend
    restart: unless-stopped
    env_file:
      - ./Back_end/.env
    environment:
      PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    depends_on:
      - mysql_db
      - redis
      - rabbitmq
    networks:
      - app-network

  frontend:
    build:
      context: ./front_end
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: web-bansach-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_db:
    name: web_bansach_mysql_db
  redis_data:
    name: web_bansach_redis_data
  rabbitmq_data:
    name: web_bansach_rabbitmq_data

networks:
  app-network:
