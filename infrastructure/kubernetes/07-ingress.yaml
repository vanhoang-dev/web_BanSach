apiVersion: networking.k8s.io/v1 # API Ingress
kind: Ingress # Route domain vào service
metadata:
  name: web-bansach # Tên Ingress
  namespace: web-bansach # Namespace ứng dụng
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01 # Issuer dùng để xin SSL
spec:
  ingressClassName: traefik # Ingress controller mặc định của k3s
  tls:
    - hosts:
        - hoanghh.xyz # Domain frontend
        - api.hoanghh.xyz # Domain backend API
      secretName: web-bansach-tls # Secret chứa certificate TLS
  rules:
    - host: hoanghh.xyz # Route frontend
      http:
        paths:
          - path: / # Match mọi path frontend
            pathType: Prefix # Match theo prefix
            backend:
              service:
                name: frontend # Service frontend
                port:
                  number: 80 # Port frontend service
    - host: api.hoanghh.xyz # Route backend API
      http:
        paths:
          - path: / # Match mọi path API
            pathType: Prefix # Match theo prefix
            backend:
              service:
                name: backend # Service backend
                port:
                  number: 8080 # Port backend service
