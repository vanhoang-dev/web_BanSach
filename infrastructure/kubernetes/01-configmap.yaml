apiVersion: v1 # API core Kubernetes
kind: ConfigMap # Lưu cấu hình không bí mật
metadata:
  name: web-bansach-config # Tên ConfigMap backend dùng
  namespace: web-bansach # Namespace ứng dụng
data:
  MYSQL_DATABASE: DUAN_WEBBANSACH # Tên database MySQL
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/DUAN_WEBBANSACH?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh # URL MySQL service nội bộ
  SPRING_DATASOURCE_USERNAME: root # User MySQL backend dùng
  REDIS_HOST: redis # Tên Redis service nội bộ
  REDIS_PORT: "6379" # Port Redis
  RABBITMQ_HOST: rabbitmq # Tên RabbitMQ service nội bộ
  RABBITMQ_PORT: "5672" # Port AMQP RabbitMQ
  RABBITMQ_USERNAME: web_bansach # User RabbitMQ
  APP_FRONTEND_URL: https://hoanghh.xyz # URL frontend production
  APP_BACKEND_URL: https://api.hoanghh.xyz # URL backend production
  APP_CORS_ALLOWED_ORIGINS: https://hoanghh.xyz # Domain được phép gọi API
