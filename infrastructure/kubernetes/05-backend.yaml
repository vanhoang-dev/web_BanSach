apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: web-bansach
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: hoangdev311/web-bansach-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-bansach-config
          env:
            - name: PORT
              value: "8080"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: REDIS_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: RABBITMQ_PASSWORD
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: APP_JWT_SECRET
            - name: GMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: GMAIL_USERNAME
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: GMAIL_APP_PASSWORD
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: CLOUDINARY_API_SECRET
            - name: SEPAY_ACCOUNT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: SEPAY_ACCOUNT_NUMBER
            - name: SEPAY_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: SEPAY_ACCOUNT_NAME
            - name: SEPAY_WEBHOOK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: web-bansach-secret
                  key: SEPAY_WEBHOOK_API_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: web-bansach
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
