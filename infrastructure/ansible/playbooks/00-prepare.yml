- name: Prepare all k3s nodes # Chuẩn bị tất cả VPS trước khi cài k3s
  hosts: k3s_cluster # Chạy trên cả master và worker
  become: true # Chạy lệnh với quyền sudo
  vars_files:
    - ../group_vars/all.yml # Nạp biến dùng chung
  tasks:
    - name: Update apt cache # Cập nhật danh sách package Ubuntu
      ansible.builtin.apt:
        update_cache: true # Bật cập nhật cache apt
        cache_valid_time: 3600 # Cache còn hạn trong 1 giờ thì không update lại

    - name: Install base packages # Cài các gói cần cho k3s và SSH
      ansible.builtin.apt:
        name: # Danh sách package cần cài
          - curl # Tải script cài đặt k3s
          - ca-certificates # Hỗ trợ HTTPS certificate
          - gnupg # Hỗ trợ khóa GPG
          - python3 # Python để Ansible chạy module
          - python3-pip # Cài thư viện Python nếu cần
          - open-iscsi # Hỗ trợ storage iSCSI
          - nfs-common # Hỗ trợ mount NFS nếu dùng storage ngoài
        state: present # Đảm bảo package đã được cài

    - name: Enable required kernel modules # Khai báo module kernel cần cho Kubernetes network
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf # File module tự load khi boot
        mode: "0644" # Quyền đọc file cấu hình
        content: | # Nội dung module cần bật
          br_netfilter # Cho iptables xử lý bridge traffic
          overlay # Hỗ trợ overlay filesystem cho container

    - name: Load br_netfilter # Load module bridge network ngay lập tức
      ansible.builtin.command: modprobe br_netfilter # Bật br_netfilter
      changed_when: false # Không đánh dấu changed vì đây là lệnh kiểm tra/bật

    - name: Load overlay # Load module overlay ngay lập tức
      ansible.builtin.command: modprobe overlay # Bật overlay
      changed_when: false # Không đánh dấu changed

    - name: Configure sysctl for Kubernetes networking # Cấu hình network kernel cho Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf # File sysctl riêng cho Kubernetes
        mode: "0644" # Quyền đọc file cấu hình
        content: | # Các tham số mạng cần bật
          net.bridge.bridge-nf-call-iptables = 1 # Cho iptables xử lý traffic bridge IPv4
          net.bridge.bridge-nf-call-ip6tables = 1 # Cho iptables xử lý traffic bridge IPv6
          net.ipv4.ip_forward = 1 # Cho phép forward packet giữa các pod/node

    - name: Apply sysctl # Áp dụng cấu hình sysctl vừa ghi
      ansible.builtin.command: sysctl --system # Reload toàn bộ sysctl
      changed_when: false # Không đánh dấu changed
