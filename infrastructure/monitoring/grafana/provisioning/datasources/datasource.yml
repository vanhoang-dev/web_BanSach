apiVersion: 1 # Phiên bản cấu hình provisioning của Grafana

datasources: # Danh sách nguồn dữ liệu Grafana
  - name: Prometheus # Tên datasource hiển thị trong Grafana
    type: prometheus # Loại datasource
    access: proxy # Grafana server gọi Prometheus thay trình duyệt
    url: http://prometheus:9090 # Địa chỉ Prometheus trong docker-compose
    isDefault: true # Đặt Prometheus làm datasource mặc định
