apiVersion: 1 # Phiên bản cấu hình provisioning của Grafana

providers: # Danh sách nguồn dashboard Grafana
  - name: WebBanSach # Tên provider dashboard
    orgId: 1 # Tổ chức mặc định trong Grafana
    folder: WebBanSach # Folder chứa dashboard trong Grafana UI
    type: file # Load dashboard từ file JSON
    disableDeletion: false # Cho phép xóa dashboard khi file bị xóa
    updateIntervalSeconds: 30 # Mỗi 30 giây quét lại file dashboard
    options:
      path: /etc/grafana/provisioning/dashboards # Thư mục chứa dashboard JSON
